name: Build & Publish Knowledge Base Embeddings

on:
  schedule:
    - cron: "0 2 * * *" # every day at 02:00 UTC; gate job restricts to once every 4 days
  workflow_dispatch: # manual trigger from GitHub UI (always runs, bypasses the gate)

permissions:
  contents: write # needed to create/upload the kb-latest release

env:
  GIT_CATEGORIES: "about community documentation tutorials"
  # Pinned explicitly (rather than left to script argparse defaults) so the
  # lexical KB and the vector KB always fetch the same amount of content and
  # can't silently drift apart again.
  #
  # "No limitations": forum fetches every visible topic (0 = unlimited), and
  # issues/pulls fetch every item (100000 is an effective "all" — the fetch
  # loop stops when GitHub returns no more pages). 100 is GitHub's max
  # comments-per-page.  See the rate-limit note in the build step below.
  FORUM_TOPICS_LIMIT: "0" # 0 = unlimited (all topics)
  GITHUB_ITEMS_LIMIT: "100000" # effectively all issues / all pulls
  GITHUB_COMMENTS_LIMIT: "100" # GitHub's per-page max
  # Embed via OpenRouter (paid). The build model, the query model
  # (precice_ai/core/embedding.py DEFAULT_MODEL), and the published manifest
  # must all agree on EMBEDDING_MODEL — a mismatch means silent garbage
  # retrieval.
  EMBEDDING_MODEL: "openai/text-embedding-3-small"
  EMBEDDING_BASE_URL: "https://openrouter.ai/api/v1"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_today: ${{ steps.check.outputs.run_today }}
    steps:
      - name: Check every-4-days schedule
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_today=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — running regardless of day-of-year."
            exit 0
          fi
          day_of_year=$(date -u +%j)
          if (( 10#$day_of_year % 4 == 0 )); then
            echo "run_today=true" >> "$GITHUB_OUTPUT"
            echo "Day of year $day_of_year is a multiple of 4 — running today."
          else
            echo "run_today=false" >> "$GITHUB_OUTPUT"
            echo "Day of year $day_of_year is not a multiple of 4 — skipping (runs every 4 days)."
          fi

  build-kb:
    needs: gate
    if: needs.gate.outputs.run_today == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout precice-ai (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout precice.github.io (content/ only)
        uses: actions/checkout@v4
        with:
          repository: precice/precice.github.io
          path: precice-docs
          fetch-depth: 0
          sparse-checkout: |
            content/docs
            content/tutorials
            content/community
            content/about
          sparse-checkout-cone-mode: false

      - name: Checkout precice/precice (docs/ only)
        uses: actions/checkout@v4
        with:
          repository: precice/precice
          ref: develop
          path: precice-core
          fetch-depth: 0
          sparse-checkout: |
            docs
          sparse-checkout-cone-mode: false

      - name: Checkout precice/tutorials
        uses: actions/checkout@v4
        with:
          repository: precice/tutorials
          ref: develop
          path: precice-tutorials-repo
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Embedding goes through the OpenRouter API — no torch on the runner.
          pip install --quiet openai numpy httpx
          pip install --quiet -e .

      - name: Ensure kb-latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view kb-latest >/dev/null 2>&1 || \
          gh release create kb-latest --title "Knowledge Base Embeddings" \
            --notes "Per-category preCICE vector KB embeddings + a lexical KB snapshot. Rebuilt by kb-ingest.yml." \
            --latest

      - name: Download current kb_state.json from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # kb_state.json lives on the kb-latest release, not in git — master's
          # branch protection has no bypass for this bot, so a git commit here
          # would fail every time (it used to, permanently). If the release
          # doesn't have one yet (first run under this scheme), kb_state.py
          # treats a missing state file as "everything is stale", which just
          # means a one-time full rebuild — no different from every run today.
          gh release download kb-latest -p kb_state.json -D . --clobber 2>/dev/null \
            && echo "Loaded kb_state.json from the kb-latest release." \
            || echo "No kb_state.json on the release yet — starting from empty state (full rebuild this run)."

      - name: Compute category signatures and diff against kb_state.json
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKOUT_DIRS: >-
            precice/precice.github.io=precice-docs
            precice/precice=precice-core
            precice/tutorials=precice-tutorials-repo
        run: |
          set -euo pipefail
          changed=""
          : > kb_signatures.txt

          check_and_track() {
            category="$1"
            sig="$2"
            echo "$category=$sig" >> kb_signatures.txt
            if python scripts/kb_state.py check --state-file kb_state.json --category "$category" --signature "$sig"; then
              echo "  $category: stale -> rebuilding"
              changed="$changed $category"
            else
              echo "  $category: unchanged -> skipping"
            fi
          }

          for category in $GIT_CATEGORIES; do
            args=""
            for pair in $CHECKOUT_DIRS; do args="$args --checkout-dir $pair"; done
            sig=$(python scripts/kb_state.py category-signature --config kb_sources.json --category "$category" $args)
            check_and_track "$category" "$sig"
          done

          forum_sig=$(python scripts/kb_state.py forum-sig --url https://precice.discourse.group)
          check_and_track "forum" "$forum_sig"

          for kind in issues pulls; do
            sig=$(python scripts/kb_state.py github-sig --repo precice/precice --kind "$kind" --github-token "$GH_TOKEN")
            check_and_track "$kind" "$sig"
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Rebuild changed categories
        if: steps.diff.outputs.changed != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -euo pipefail
          # One canonical pipeline (precice_ai/kb): clean -> chunk -> embed ->
          # kb-embeddings-<category>.npz. The lexical store is derived from the
          # npz files in the finalize step below, so both stores always hold
          # identical chunks and chunk_ids. EMBEDDING_MODEL / EMBEDDING_BASE_URL
          # come from the job env.
          python scripts/rebuild_kb.py \
            --out-dir . \
            --no-finalize \
            --categories $CHANGED \
            --checkout-dir precice/precice.github.io=precice-docs \
            --checkout-dir precice/precice=precice-core \
            --checkout-dir precice/tutorials=precice-tutorials-repo \
            --forum-topics-limit "$FORUM_TOPICS_LIMIT" \
            --items-limit "$GITHUB_ITEMS_LIMIT" \
            --comments-limit "$GITHUB_COMMENTS_LIMIT"

      - name: Download existing assets for unchanged categories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -euo pipefail
          # Finalize below needs all 7 categories' npz files locally; unchanged
          # categories weren't rebuilt this run, so pull them from the release.
          for category in about community documentation tutorials forum issues pulls; do
            case " $CHANGED " in
              *" $category "*) continue ;;
            esac
            echo "Fetching existing assets for unchanged category: $category"
            gh release download kb-latest -p "kb-embeddings-$category.npz" -D . --clobber
          done

      - name: Finalize lexical store + manifest, and validate
        run: |
          # Derives kb-lexical.json and kb-manifest.json (schema_version,
          # per-category counts, embedding model + dimension, timestamp) from
          # the npz files, then fails the job if validation finds problems.
          python scripts/finalize_kb.py --dir . --lexical-name kb-lexical.json

      - name: Upload changed category assets
        if: steps.diff.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -euo pipefail
          for category in $CHANGED; do
            gh release upload kb-latest "kb-embeddings-$category.npz" --clobber
          done

      - name: Upload lexical KB asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload kb-latest kb-lexical.json --clobber

      - name: Upload embedding manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload kb-latest kb-manifest.json --clobber

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          gh release edit kb-latest --notes "Updated vector categories [$CHANGED] and lexical KB on ${TIMESTAMP} (model: ${EMBEDDING_MODEL}) from precice/precice.github.io, precice/precice, precice/tutorials, precice.discourse.group, precice/precice issues & pulls"

      - name: Update kb_state.json and upload to release
        if: steps.diff.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -euo pipefail
          for category in $CHANGED; do
            sig=$(grep "^$category=" kb_signatures.txt | head -1 | cut -d= -f2-)
            python scripts/kb_state.py update --state-file kb_state.json --category "$category" --signature "$sig"
          done
          # Persisted on the kb-latest release, not git — see the earlier
          # "Download current kb_state.json" step for why.
          gh release upload kb-latest kb_state.json --clobber
