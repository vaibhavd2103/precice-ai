name: Build & Publish Knowledge Base Embeddings

on:
  schedule:
    - cron: '0 2 * * *'   # every day at 02:00 UTC; gate job restricts to once every 4 days
  workflow_dispatch:        # manual trigger from GitHub UI (always runs, bypasses the gate)

permissions:
  contents: write           # needed to create/upload releases and commit kb_state.json

env:
  GIT_CATEGORIES: "about community documentation tutorials"
  # Pinned explicitly (rather than left to script argparse defaults) so the
  # lexical KB and the vector KB always fetch the same amount of content and
  # can't silently drift apart again.
  FORUM_TOPICS_LIMIT: "0"        # 0 = unlimited, matches current behavior
  GITHUB_ITEMS_LIMIT: "200"
  GITHUB_COMMENTS_LIMIT: "20"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_today: ${{ steps.check.outputs.run_today }}
    steps:
      - name: Check every-4-days schedule
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_today=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — running regardless of day-of-year."
            exit 0
          fi
          day_of_year=$(date -u +%j)
          if (( 10#$day_of_year % 4 == 0 )); then
            echo "run_today=true" >> "$GITHUB_OUTPUT"
            echo "Day of year $day_of_year is a multiple of 4 — running today."
          else
            echo "run_today=false" >> "$GITHUB_OUTPUT"
            echo "Day of year $day_of_year is not a multiple of 4 — skipping (runs every 4 days)."
          fi

  build-kb:
    needs: gate
    if: needs.gate.outputs.run_today == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout precice-ai (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only HEAD content is needed now — signatures are content tree hashes,
      # not commit history — but fetch-depth: 0 is kept for the other repos
      # below since git log/tree lookups still expect refs to be resolvable.
      - name: Checkout precice.github.io (content/ only)
        uses: actions/checkout@v4
        with:
          repository: precice/precice.github.io
          path: precice-docs
          fetch-depth: 0
          sparse-checkout: |
            content/docs
            content/tutorials
            content/community
            content/about
          sparse-checkout-cone-mode: false

      - name: Checkout precice/precice (docs/ only)
        uses: actions/checkout@v4
        with:
          repository: precice/precice
          ref: develop
          path: precice-core
          fetch-depth: 0
          sparse-checkout: |
            docs
          sparse-checkout-cone-mode: false

      - name: Checkout precice/tutorials
        uses: actions/checkout@v4
        with:
          repository: precice/tutorials
          ref: develop
          path: precice-tutorials-repo
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --quiet openai numpy httpx
          pip install --quiet -e .

      - name: Compute category signatures (always rebuild every run)
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKOUT_DIRS: >-
            precice/precice.github.io=precice-docs
            precice/precice=precice-core
            precice/tutorials=precice-tutorials-repo
        run: |
          set -euo pipefail
          # The gate job already limits this workflow to one run per 96h
          # (every 4 days), so every category is rebuilt and republished
          # unconditionally on every run — the KB should never go stale for
          # longer than that, even if a category's content hash happens to
          # match the last publish. Signatures are still computed and
          # recorded in kb_state.json purely as an audit trail (last known
          # hash per category), not as a build gate.
          changed=""
          : > kb_signatures.txt
          for category in $GIT_CATEGORIES; do
            args=""
            for pair in $CHECKOUT_DIRS; do args="$args --checkout-dir $pair"; done
            # Content tree hash of a fresh clone — logged for audit purposes.
            sig=$(python scripts/kb_state.py category-signature --config kb_sources.json --category "$category" $args)
            echo "  $category tree hash: $sig -> rebuilding"
            changed="$changed $category"
            echo "$category=$sig" >> kb_signatures.txt
          done

          # forum/issues/pulls have no git repo to hash — keep the lightweight
          # live signature (latest post/updated_at) fetched from their APIs,
          # logged the same way.
          forum_sig=$(python scripts/kb_state.py forum-sig --url https://precice.discourse.group)
          echo "  forum signature: $forum_sig -> rebuilding"
          changed="$changed forum"
          echo "forum=$forum_sig" >> kb_signatures.txt

          for kind in issues pulls; do
            sig=$(python scripts/kb_state.py github-sig --repo precice/precice --kind "$kind" --github-token "$GH_TOKEN")
            echo "  $kind signature: $sig -> rebuilding"
            changed="$changed $kind"
            echo "$kind=$sig" >> kb_signatures.txt
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Build changed Markdown categories
        if: steps.diff.outputs.changed != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          CHECKOUT_DIRS: >-
            precice/precice.github.io=precice-docs
            precice/precice=precice-core
            precice/tutorials=precice-tutorials-repo
        run: |
          set -euo pipefail
          for category in $CHANGED; do
            case "$category" in
              forum|issues|pulls) continue ;;
            esac
            args=""
            for pair in $CHECKOUT_DIRS; do args="$args --checkout-dir $pair"; done
            sources_json=$(python scripts/render_sources_json.py --config kb_sources.json --category "$category" $args)
            echo "Building category: $category"
            python scripts/build_embeddings.py \
              --category "$category" \
              --sources-json "$sources_json" \
              --api-key "$OPENROUTER_API_KEY" \
              --base-url "https://openrouter.ai/api/v1" \
              --model "openai/text-embedding-3-small" \
              --output "kb-embeddings-$category.npz" \
              --lexical-output "kb-lexical-$category.json"
          done

      - name: Build forum category
        if: contains(steps.diff.outputs.changed, 'forum')
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/build_forum_embeddings.py \
            --forum-url "https://precice.discourse.group" \
            --topics-limit "$FORUM_TOPICS_LIMIT" \
            --api-key "$OPENROUTER_API_KEY" \
            --base-url "https://openrouter.ai/api/v1" \
            --model "openai/text-embedding-3-small" \
            --output "kb-embeddings-forum.npz" \
            --lexical-output "kb-lexical-forum.json"

      - name: Build GitHub issues/pulls categories
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -euo pipefail
          for kind in issues pulls; do
            case " $CHANGED " in
              *" $kind "*)
                echo "Building category: $kind"
                python scripts/build_github_activity_embeddings.py \
                  --repo precice/precice \
                  --kind "$kind" \
                  --items-limit "$GITHUB_ITEMS_LIMIT" \
                  --comments-limit "$GITHUB_COMMENTS_LIMIT" \
                  --api-key "$OPENROUTER_API_KEY" \
                  --github-token "$GH_TOKEN" \
                  --base-url "https://openrouter.ai/api/v1" \
                  --model "openai/text-embedding-3-small" \
                  --output "kb-embeddings-$kind.npz" \
                  --lexical-output "kb-lexical-$kind.json"
                ;;
            esac
          done

      - name: Verify built vector archives
        if: steps.diff.outputs.changed != ''
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -euo pipefail
          for category in $CHANGED; do
            python - "$category" <<'EOF'
          import numpy as np, json, sys
          category = sys.argv[1]
          data = np.load(f"kb-embeddings-{category}.npz", allow_pickle=True)
          chunks = json.loads(data["chunks"].item())
          emb = data["embeddings"]
          print(f"{category}: chunks={len(chunks)} embeddings={emb.shape} dtype={emb.dtype}")
          if emb.shape[0] != len(chunks):
              sys.exit(f"{category}: chunk/embedding count mismatch")

          # Direct proof that the lexical fragment and the vector chunks for
          # this category are in parity (same extraction step feeds both).
          lexical = json.load(open(f"kb-lexical-{category}.json"))
          lexical_chunks = lexical["chunks"]
          print(f"{category}: lexical_chunks={len(lexical_chunks)}")
          if len(lexical_chunks) != len(chunks):
              sys.exit(f"{category}: lexical/vector chunk count mismatch")
          EOF
          done

      # Lexical KB: merge the per-category chunk fragments emitted by the
      # build steps above (--lexical-output) into the final kb-lexical.json.
      # Every category is always rebuilt every run (see the "always rebuild"
      # comment above), so all 7 fragments always exist here — this keeps
      # the lexical KB in exact chunk-for-chunk parity with the vector KB,
      # since both come from the same extraction step per category.
      - name: Merge lexical fragments
        run: |
          python - <<'EOF'
          import json
          from datetime import datetime, timezone

          categories = "about community documentation tutorials forum issues pulls".split()
          chunks = []
          for category in categories:
              with open(f"kb-lexical-{category}.json") as f:
                  chunks.extend(json.load(f)["chunks"])

          payload = {
              "updated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "categories": categories,
              "count": len(chunks),
              "chunks": chunks,
          }
          with open("kb-lexical.json", "w") as f:
              json.dump(payload, f, ensure_ascii=False)
          print(f"Merged {len(chunks)} chunks across {len(categories)} categories into kb-lexical.json")
          EOF

      # The release is never deleted wholesale — unchanged categories keep
      # their existing asset untouched, only rebuilt ones are re-uploaded.
      - name: Ensure kb-latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view kb-latest >/dev/null 2>&1 || \
          gh release create kb-latest --title "Knowledge Base Embeddings" \
            --notes "Per-category preCICE vector KB embeddings + a lexical KB snapshot. Rebuilt incrementally by kb-ingest.yml." \
            --latest

      - name: Upload changed vector category assets
        if: steps.diff.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -euo pipefail
          for category in $CHANGED; do
            gh release upload kb-latest "kb-embeddings-$category.npz" --clobber
          done

      - name: Upload lexical KB asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload kb-latest kb-lexical.json --clobber

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          gh release edit kb-latest --notes "Updated vector categories [$CHANGED] and lexical KB on ${TIMESTAMP} from precice/precice.github.io, precice/precice, precice/tutorials, precice.discourse.group, precice/precice issues & pulls"

      - name: Update kb_state.json and commit
        if: steps.diff.outputs.changed != ''
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -euo pipefail
          for category in $CHANGED; do
            sig=$(grep "^$category=" kb_signatures.txt | head -1 | cut -d= -f2-)
            python scripts/kb_state.py update --state-file kb_state.json --category "$category" --signature "$sig"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kb_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update kb_state.json for changed categories [$CHANGED]"
            git push
          fi
