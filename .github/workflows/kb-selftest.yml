name: KB Local-Embedding Self-Test

# Run this manually from the Actions tab (Run workflow).
# It proves three things end-to-end, with NO API key and NO credits:
#   1. embeddings can be built locally on the runner (sentence-transformers)
#   2. the .npz / lexical / manifest artifacts pass the same parity checks
#      your real pipeline uses
#   3. the runner (not any end user) publishes assets to a release that
#      end users can simply download
on:
  workflow_dispatch:

permissions:
  contents: write # lets THIS workflow (the runner) publish the release

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Install dependencies (no openai/httpx-to-API needed)
        run: pip install --quiet sentence-transformers numpy httpx

      - name: Build sample embeddings locally
        env:
          EMBED_MODEL: BAAI/bge-small-en-v1.5
        run: |
          python - <<'EOF'
          import os, json, httpx, numpy as np
          from datetime import datetime, timezone
          from sentence_transformers import SentenceTransformer

          MODEL = os.environ["EMBED_MODEL"]

          # --- pull a few REAL preCICE forum topics (public, no auth) ---
          # Falls back to a small fixed set if the network hiccups, so the
          # embedding + publish path is always exercised.
          try:
              r = httpx.get("https://precice.discourse.group/latest.json", timeout=20)
              r.raise_for_status()
              topics = r.json()["topic_list"]["topics"][:15]
              chunks = [
                  {"id": f"forum-{t['id']}", "source": "forum",
                   "title": t["title"],
                   "text": t.get("fancy_title") or t["title"]}
                  for t in topics
              ]
              print(f"Fetched {len(chunks)} live forum topics")
          except Exception as e:
              print(f"Live fetch failed ({e!r}); using fallback chunks")
              chunks = [{"id": f"fb-{i}", "source": "forum", "title": s, "text": s}
                        for i, s in enumerate([
                          "How do I install preCICE on Ubuntu?",
                          "Configuring an implicit coupling scheme in precice-config.xml",
                          "IQN-ILS acceleration diverges for my FSI case",
                          "Radial basis function mapping between non-matching meshes",
                          "Running the flow-over-heated-plate tutorial with OpenFOAM",
                      ])]

          model = SentenceTransformer(MODEL)
          texts = [c["text"] for c in chunks]
          # documents get NO instruction prefix for bge-*-en-v1.5
          emb = model.encode(texts, normalize_embeddings=True,
                             convert_to_numpy=True).astype(np.float32)

          # save in the exact layout your existing verify step reads
          np.savez("kb-embeddings-selftest.npz",
                   embeddings=emb, chunks=np.array(json.dumps(chunks)))
          with open("kb-lexical-selftest.json", "w") as f:
              json.dump({"chunks": chunks}, f, ensure_ascii=False)
          with open("kb-manifest.json", "w") as f:
              json.dump({"model": MODEL, "dim": int(emb.shape[1]),
                         "normalized": True,
                         "built_at": datetime.now(timezone.utc)
                                     .isoformat().replace("+00:00", "Z")}, f)
          print(f"Built {emb.shape[0]} embeddings of dim {emb.shape[1]}")
          EOF

      - name: Verify parity (same checks as the real pipeline)
        run: |
          python - <<'EOF'
          import json, numpy as np
          data = np.load("kb-embeddings-selftest.npz", allow_pickle=True)
          chunks = json.loads(data["chunks"].item())
          emb = data["embeddings"]
          print(f"chunks={len(chunks)} embeddings={emb.shape} dtype={emb.dtype}")
          assert emb.shape[0] == len(chunks), "chunk/embedding count mismatch"
          lex = json.load(open("kb-lexical-selftest.json"))["chunks"]
          assert len(lex) == len(chunks), "lexical/vector count mismatch"
          print("parity OK")
          EOF

      - name: Retrieval sanity check
        run: |
          python - <<'EOF'
          import json, numpy as np
          from sentence_transformers import SentenceTransformer
          man = json.load(open("kb-manifest.json"))
          data = np.load("kb-embeddings-selftest.npz", allow_pickle=True)
          chunks = json.loads(data["chunks"].item()); emb = data["embeddings"]
          model = SentenceTransformer(man["model"])
          # QUERY side DOES get the bge instruction prefix
          q = "Represent this sentence for searching relevant passages: how do I install preCICE"
          qv = model.encode([q], normalize_embeddings=True, convert_to_numpy=True)[0]
          sims = emb @ qv
          for i in np.argsort(-sims)[:3]:
              print(f"  {sims[i]:.3f}  {chunks[i]['title']}")
          EOF

      - name: Publish to kb-selftest release (central-publish check)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view kb-selftest >/dev/null 2>&1 || \
            gh release create kb-selftest --title "KB Self-Test (safe to delete)" \
              --notes "Smoke-test artifacts from local embeddings. Not for production." \
              --prerelease
          gh release upload kb-selftest \
            kb-embeddings-selftest.npz kb-lexical-selftest.json kb-manifest.json --clobber
          echo "Published. End users would download with:"
          echo "  gh release download kb-selftest -R \$GITHUB_REPOSITORY -p 'kb-*'"
