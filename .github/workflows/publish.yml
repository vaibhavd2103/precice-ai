name: Publish to PyPI

# Independent of kb-ingest.yml (which runs on its own schedule and publishes
# KB data to the separate "kb-latest" GitHub Release) — this workflow only
# reacts to the release branch and never touches that release or its tag.
on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require release branch for manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/release'
        run: |
          echo "::error::workflow_dispatch must be run against the 'release' branch (selected branch: ${{ github.ref_name }})."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package name & version
        id: meta
        run: |
          python -c "
          import tomllib
          data = tomllib.load(open('pyproject.toml', 'rb'))['project']
          print(f\"name={data['name']}\")
          print(f\"version={data['version']}\")
          " >> "$GITHUB_OUTPUT"

      - name: Check version isn't already on PyPI
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          version="${{ steps.meta.outputs.version }}"
          status=$(curl -s -o /tmp/pypi.json -w "%{http_code}" "https://pypi.org/pypi/${name}/json")
          if [ "$status" = "404" ]; then
            echo "Package '$name' has no releases on PyPI yet — proceeding with first release."
          elif [ "$status" != "200" ]; then
            echo "::error::Unexpected PyPI API response ($status) while checking existing versions."
            exit 1
          elif python -c "import json,sys; d=json.load(open('/tmp/pypi.json')); sys.exit(0 if '$version' in d['releases'] else 1)"; then
            echo "::error::Version $version of $name is already published on PyPI. Bump the version in pyproject.toml before merging to release."
            exit 1
          else
            echo "Version $version of $name is not yet on PyPI — proceeding."
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI OIDC trusted publishing — no API token secret needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  tag-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the vX.Y.Z tag + GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: meta
        run: |
          python -c "
          import tomllib
          print('version=' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          " >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.meta.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists — skipping (already tagged by a prior run)."
            exit 0
          fi
          gh release create "$tag" dist/*.whl dist/*.tar.gz \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes
